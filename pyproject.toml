[project]
name = "rocket-landing"
version = "0.1.0"
description = "A minimal 2D booster landing simulator for physics and RL experimentation"
readme = "README.md"
authors = [
    { name = "Mathis LAMBERT", email = "mathis.lambert27@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "pygame>=2.6.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
rocket-landing = "rocket_landing:main"

[build-system]
requires = ["uv_build>=0.11.9,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
