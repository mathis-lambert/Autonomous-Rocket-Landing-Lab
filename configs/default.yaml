name: default_descent
description: Standard vertical descent setup used by the CLI by default.

vehicle:
  dry_mass: 22000.0
  initial_fuel: 8000.0
  max_thrust: 650000.0
  fuel_flow_rate: 120.0
  length: 24.0
  radius: 1.8
  max_gimbal: 0.15

environment:
  gravity: 9.81

landing:
  max_landing_vz: 3.0
  max_landing_vx: 1.5
  max_landing_theta: 0.10
  max_landing_omega: 0.25

initial_state:
  x: 0.0
  z: 120.0
  vx: 0.0
  vz: -15.0
  theta: 0.0
  omega: 0.0
  fuel: 8000.0
