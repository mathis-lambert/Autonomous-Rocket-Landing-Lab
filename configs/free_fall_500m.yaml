name: free_fall_500m
description: High-altitude free-fall scenario starting from 500 meters for policy recovery tests.

vehicle:
  dry_mass: 22000.0
  initial_fuel: 12000.0
  max_thrust: 900000.0
  fuel_flow_rate: 80.0
  length: 24.0
  radius: 1.8
  max_gimbal: 0.30

environment:
  gravity: 9.81

aerodynamics:
  air_density_sea_level: 1.225
  atmosphere_scale_height: 8500.0
  axial_drag_coefficient: 0.35
  side_drag_coefficient: 1.15
  center_of_pressure_offset: 7.0
  angular_damping_coefficient: 0.12
  control_surface_force_coefficient: 0.75

landing:
  target_x: 0.0
  max_landing_vz: 3.0
  max_landing_vx: 1.5
  max_landing_theta: 0.10
  max_landing_omega: 0.25
  max_landing_x: 5.0

controls:
  throttle_rate: 1.15
  engine_gimbal_rate: 1.25
  aero_steer_rate: 4.0
  steering_return_rate: 1.65

initial_state:
  x: 0.0
  z: 500.0
  vx: 0.0
  vz: 0.0
  theta: 0.0
  omega: 0.0
  fuel: 12000.0
